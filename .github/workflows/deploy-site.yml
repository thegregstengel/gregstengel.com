name: Deploy site root to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - '404.html'
      - 'styles.css'
      - '*.js'
      - 'assets/**'
      - 'CNAME'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'sitemap-pages.xml'
      - 'site.webmanifest'
      - 'favicon.ico'
      - 'apple-touch-icon.png'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          path: src

      - name: Checkout gh-pages
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: pages

      - name: Sync root files from main into gh-pages
        run: |
          set -euo pipefail
          # Mirror root files from main onto gh-pages. /blog/ is owned by
          # deploy-blog.yml so it is excluded from both sides of the sync;
          # .git/, .github/, .claude/ and scripts/ are repo plumbing, and the markdown
          # working docs (README, CLAUDE.md, BRIEF.md) are not site content --
          # none of them belong on the live site.
          rsync -av --delete \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.claude/' \
            --exclude='/scripts/' \
            --exclude='/blog/' \
            --exclude='/README.md' \
            --exclude='/CLAUDE.md' \
            --exclude='/BRIEF.md' \
            --exclude='/.gitignore' \
            src/ pages/
          # rsync --delete leaves excluded paths alone, so anything that was
          # published before it was excluded has to be removed explicitly.
          rm -rf pages/README.md pages/CLAUDE.md pages/BRIEF.md pages/.claude pages/scripts
          # Ensure GitHub Pages serves files verbatim (no Jekyll processing).
          touch pages/.nojekyll

      - name: Commit and push gh-pages
        working-directory: pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "deploy: ${GITHUB_SHA}"
          git push origin gh-pages
