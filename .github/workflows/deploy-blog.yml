name: Deploy Blog to GitHub Pages

on:
  push:
    paths:
      - 'blog/**'
      - '.github/workflows/deploy-blog.yml'
    branches:
      - main

# Shared with deploy-site.yml: both push to gh-pages, so they must not overlap.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # 3.4 ships a RubyGems new enough to resolve sass-embedded's
          # prebuilt x86_64-linux-gnu gem; older 3.1 fell back to the
          # source gem and failed to build the native extension.
          ruby-version: 3.4

      - name: Install dependencies
        run: bundle install

      - name: Build site
        # Deliberately NOT JEKYLL_ENV=production: in production Chirpy imports
        # `main.bundle`, which only exists after the theme's npm build. This
        # workflow has no Node step, so a production build fails at the SCSS.
        run: bundle exec jekyll build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./blog/_site
          destination_dir: blog

